name: 验证后可信发布
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - run: pnpm --config.verify-deps-before-run=false --config.manage-package-manager-versions=false install --frozen-lockfile
      - name: 核对不可变标签版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)process.exit(1)"
      - run: npm run build && npm run check:package
      # 启用前须获首次发布授权，并在 npm 配置此仓库/workflow/环境的 trusted publisher。
      - run: npm publish --provenance --access public
