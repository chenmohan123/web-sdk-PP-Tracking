name: 验证后可信发布
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 先核对不可变标签版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release.mjs --validate-tag
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.13.0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - run: pnpm --config.verify-deps-before-run=false --config.manage-package-manager-versions=false install --frozen-lockfile
      - run: npm run build && npm run check:package
      - name: 核对已有版本或通过 OIDC 发布唯一候选
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release.mjs
